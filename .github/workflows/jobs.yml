
name: Job Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 12 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 16 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run job automation
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          python jobs.py

      - name: Send complete formatted job report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import csv
          import os
          import requests
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          csv_file = Path("applications.csv")

          if not csv_file.exists():
              raise SystemExit("applications.csv not found")

          with csv_file.open(
              "r", newline="", encoding="utf-8-sig"
          ) as f:
              jobs = list(csv.DictReader(f))

          # Latest saved jobs first
          jobs.reverse()

          def get_value(job, key, default="N/A"):
              return (job.get(key) or default).strip()

          blocks = []

          for i, job in enumerate(jobs, 1):
              title = get_value(job, "Job Title")
              company = get_value(job, "Company")
              location = get_value(job, "Location")
              score = get_value(job, "Match Score", "0")
              status = get_value(job, "Status")
              source = get_value(job, "Source")
              link = get_value(job, "Apply Link", "")

              try:
                  score = f"{float(score):g}%"
              except (ValueError, TypeError):
                  score = f"{score}%"

              block = (
                  f"🔹 {i}. {title}\n"
                  f"🏢 Company: {company}\n"
                  f"📍 Location: {location}\n"
                  f"🎯 Resume Match: {score}\n"
                  f"🌐 Source: {source}\n"
                  f"📌 Status: {status}\n"
                  f"🔗 Apply: {link or 'Link unavailable'}"
              )
              blocks.append(block)

          if not blocks:
              blocks = ["😕 No jobs are currently saved in the tracker."]

          # Split into multiple messages without dropping jobs
          limit = 3000
          chunks = []
          current = ""

          for block in blocks:
              addition = block + "\n\n━━━━━━━━━━━━━━━━━━\n\n"

              if len(current) + len(addition) > limit and current:
                  chunks.append(current.rstrip())
                  current = ""

              current += addition

          if current:
              chunks.append(current.rstrip())

          total_parts = len(chunks)

          for index, chunk in enumerate(chunks, 1):
              header = (
                  "💼 IT JOB ALERTS\n"
                  "━━━━━━━━━━━━━━━━━━\n"
                  f"📊 Total tracked jobs: {len(jobs)}\n"
                  f"📨 Part {index}/{total_parts}\n\n"
              )

              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": header + chunk
                  },
                  timeout=30
              )
              response.raise_for_status()

              if not response.json().get("ok"):
                  raise SystemExit(
                      f"Telegram delivery failed on part {index}"
                  )

          print(
              f"Telegram report sent: {len(jobs)} jobs "
              f"in {total_parts} message(s)."
          )
          PY

      - name: Save application tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add applications.csv

          git diff --cached --quiet || git commit -m "Update job application tracker"

          git push
