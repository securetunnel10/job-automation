
name: Job Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"
      timezone: "Asia/Kolkata"
    - cron: "30 6 * * *"
      timezone: "Asia/Kolkata"
    - cron: "30 10 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run job automation
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          python jobs.py

      - name: Send job report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import csv
          import os
          import requests
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          csv_file = Path("applications.csv")

          if not csv_file.exists():
              raise SystemExit("applications.csv was not created")

          with csv_file.open(
              "r", newline="", encoding="utf-8-sig"
          ) as f:
              jobs = list(csv.DictReader(f))

          jobs = jobs[-10:][::-1]

          lines = [
              "JOB AUTOMATION REPORT",
              "Latest 10 tracked jobs",
              f"Total jobs in tracker: {len(list(csv.DictReader(csv_file.open('r', encoding='utf-8-sig'))))}",
              ""
          ]

          if not jobs:
              lines.append("No jobs found in applications.csv.")
          else:
              for i, job in enumerate(jobs, 1):
                  title = job.get("Job Title", "N/A")
                  company = job.get("Company", "N/A")
                  location = job.get("Location", "N/A")
                  score = job.get("Match Score", "N/A")
                  status = job.get("Status", "N/A")
                  link = job.get("Apply Link", "")

                  lines.extend([
                      f"{i}. {title}",
                      f"Company: {company}",
                      f"Location: {location}",
                      f"Match: {score}%",
                      f"Status: {status}",
                      f"Apply: {link}",
                      ""
                  ])

          message = "\n".join(lines)
          if len(message) > 3900:
              message = message[:3850] + "\n\nReport shortened. See applications.csv on GitHub."

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": message},
              timeout=20
          )
          response.raise_for_status()

          result = response.json()
          if not result.get("ok"):
              raise SystemExit("Telegram API did not confirm message delivery")

          print("Telegram report sent successfully.")
          PY

      - name: Save application tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add applications.csv

          git diff --cached --quiet || git commit -m "Update job application tracker"

          git push
